---
# Synchronize SlurmDBD Accounts, Job QoS, and host-specific user Associations.
# This playbook uses MUNGE through sacctmgr and needs no database credentials.
- name: Synchronize Slurm accounting policy and partition associations
  hosts: controllers
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../vars/users.yml
    - ../vars/slurm_accounts.yml
    - ../vars/slurm_partitions.yml
    - ../vars/slurm_qos.yml
  roles:
    - slurm_associations
