# Authoritative cluster identity and SSH-authorization manifest.
#
# Each user defines a stable local identity, account attributes, managed access
# groups, and full inventory hostnames in ssh_access. Every user is implicitly
# authorized on controller hosts, so controller names are not repeated there.
# Account presence alone does not grant compute-host SSH access. Never store
# private keys or authorized_keys contents in this manifest.
cluster_users:
  - name: liuhongbo
    uid: 10000
    gid: 10000
    slurm_account: epic-rl
    home: /home/liuhongbo
    shell: /bin/bash
    groups:
      - EPIC-RL
    ssh_access:
      - epic-cluster-compute-a100-01
      - epic-cluster-compute-rtx4070-01
