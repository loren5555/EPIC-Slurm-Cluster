---
# Slurm submission permissions are declared independently from SSH access.
# Resource limits belong to Account declarations, not partition declarations.
slurm_partitions:
  - name: epic-cluster-compute-a100-01
    host: epic-cluster-compute-a100-01
    management_class: controlled
    allowed_accounts:
      - epic-rl
      - cgcl
      - mllms
      - cv3d
      - nue
      - individual
    allowed_users: []
    denied_users: []

  - name: epic-cluster-compute-rtx4070-01
    host: epic-cluster-compute-rtx4070-01
    management_class: free
    allowed_accounts: []
    allowed_users:
      - liuhongbo
      - huodongkun
    denied_users: []
