---
- name: Require a SlurmDBD database password from Ansible Vault
  ansible.builtin.assert:
    that:
      # The db key should be generated with openssl rand -hex 32
      - slurmdbd_storage_password is defined
      - slurmdbd_storage_password is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Define slurmdbd_storage_password in vars/secrets.yml as the
      64-character lowercase hexadecimal value generated by
      `openssl rand -hex 32`.
    quiet: true
  no_log: true

- name: Install the local MariaDB settings for Slurm accounting
  ansible.builtin.template:
    src: 60-slurmdbd.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/60-slurmdbd.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart MariaDB

- name: Apply pending MariaDB configuration changes
  ansible.builtin.meta: flush_handlers

- name: Keep MariaDB enabled and running
  ansible.builtin.systemd_service:
    name: mariadb.service
    enabled: true
    state: started
  when: not ansible_check_mode

# Ensure the SlurmDBD database is created and accessible before starting the daemon.
- name: Initialize the local Slurm accounting database
  ansible.builtin.import_tasks: database.yml
  when: not ansible_check_mode

- name: Preserve the standard Slurm log directory
  ansible.builtin.file:
    path: /var/log/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"

- name: Preserve the SlurmDBD log with daemon ownership
  ansible.builtin.file:
    path: /var/log/slurm/slurmdbd.log
    state: touch
    owner: slurm
    group: slurm
    mode: "0640"
    access_time: preserve
    modification_time: preserve

- name: Install the protected SlurmDBD configuration
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: "0600"
  no_log: true
  notify: Restart SlurmDBD

- name: Apply pending SlurmDBD configuration changes
  ansible.builtin.meta: flush_handlers

- name: Keep SlurmDBD enabled and running
  ansible.builtin.systemd_service:
    name: slurmdbd.service
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Verify the standalone accounting service
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode
