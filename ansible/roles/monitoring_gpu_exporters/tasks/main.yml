---
- name: Locate the manually installed nvitop-exporter binary
  ansible.builtin.stat:
    path: /opt/nvitop-exporter/bin/nvitop-exporter
  register: monitoring_nvitop_exporter_binary

- name: Require nvitop-exporter before configuring its service
  ansible.builtin.assert:
    that:
      - monitoring_nvitop_exporter_binary.stat.exists
      - monitoring_nvitop_exporter_binary.stat.executable | default(false)
    fail_msg: >-
      Install nvitop-exporter in /opt/nvitop-exporter before running the
      monitoring playbook.
    quiet: true

- name: Create the DCGM exporter configuration directory
  ansible.builtin.file:
    path: /etc/dcgm-exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the DCGM collection policy
  ansible.builtin.template:
    src: dcgm-exporter-config.yaml.j2
    dest: "{{ monitoring_dcgm_configuration_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart GPU exporters

- name: Install the container-backed DCGM exporter service
  ansible.builtin.template:
    src: nvidia-dcgm-exporter.service.j2
    dest: /etc/systemd/system/nvidia-dcgm-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart GPU exporters

- name: Install the nvitop-exporter systemd service
  ansible.builtin.template:
    src: nvitop-exporter.service.j2
    dest: /etc/systemd/system/nvitop-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart GPU exporters

- name: Apply pending GPU exporter service changes
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Keep both GPU exporters enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nvidia-dcgm-exporter.service
    - nvitop-exporter.service
  when: not ansible_check_mode

- name: Wait until both GPU exporters serve local metrics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.port }}/metrics"
    return_content: true
    status_code: 200
  loop:
    - name: dcgm
      port: "{{ monitoring_dcgm_exporter_port }}"

    - name: nvitop
      port: "{{ monitoring_nvitop_exporter_port }}"
  loop_control:
    label: "{{ item.name }}"
  register: monitoring_gpu_exporter_metrics

  # Retry until the exporter is listening and has produced Prometheus metrics.
  until:
    - monitoring_gpu_exporter_metrics.status == 200
    - "'# HELP' in monitoring_gpu_exporter_metrics.content"
  retries: 20
  delay: 3

  changed_when: false
  when: not ansible_check_mode