---
# Reconfiguration is forwarded by slurmctld so all daemons reread slurm.conf
# without a process restart. cgroup.conf and gres.conf changes still require the
# compute daemon restart handled below.
- name: Reconfigure Slurm daemons
  ansible.builtin.command:
    argv:
      - /usr/bin/scontrol
      - reconfigure
  when:
    - not ansible_check_mode
    - inventory_hostname in groups['controllers']

- name: Restart slurmd
  ansible.builtin.systemd_service:
    name: slurmd.service
    state: restarted
  when:
    - not ansible_check_mode
    - inventory_hostname in groups['compute_nodes']
