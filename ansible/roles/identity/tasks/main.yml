---
# Keep validation, human-readable planning, and mutation as explicit phases.
# Imported task files share the role variables and execute in this order.
- name: Run identity conflict preflight
  ansible.builtin.import_tasks: preflight.yml

- name: Show the identity change plan
  ansible.builtin.import_tasks: plan.yml

- name: Synchronize cluster identities
  ansible.builtin.import_tasks: converge.yml
