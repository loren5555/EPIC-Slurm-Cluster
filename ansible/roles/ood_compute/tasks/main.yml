---
- name: Inspect required OOD interactive application runtimes
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ ood_compute_runtime_executables }}"
  loop_control:
    label: "{{ item.application }}: {{ item.path }}"
  register: ood_compute_runtime_checks

- name: Require the standard OOD interactive application runtime set
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.executable
    fail_msg: >-
      {{ item.item.application }} requires executable {{ item.item.path }}
      ({{ item.item.name }}) on {{ inventory_hostname }}. Complete the OOD IAPP
      runtime section in docs/developer/08-compute-node-environment.md before
      running playbooks/ood.yml.
    quiet: true
  loop: "{{ ood_compute_runtime_checks.results }}"
  loop_control:
    label: "{{ item.item.application }}: {{ item.item.path }}"

- name: Create the OOD context mount point
  ansible.builtin.file:
    path: "{{ ood_shared_root }}"
    state: directory

- name: Install the OOD context mount unit
  ansible.builtin.template:
    src: srv-epic-ood.mount.j2
    dest: /etc/systemd/system/srv-epic-ood.mount
    owner: root
    group: root
    mode: "0644"
  register: ood_mount_unit

- name: Install the OOD context automount unit
  ansible.builtin.template:
    src: srv-epic-ood.automount.j2
    dest: /etc/systemd/system/srv-epic-ood.automount
    owner: root
    group: root
    mode: "0644"
  register: ood_automount_unit

- name: Reload systemd after changing OOD context units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ood_mount_unit.changed or ood_automount_unit.changed

- name: Enable the OOD context automount
  ansible.builtin.systemd_service:
    name: srv-epic-ood.automount
    enabled: true
    state: started
  when: not ansible_check_mode
