---
# Planning deliberately reads the live SlurmDBD even in check mode. The
# declaration alone cannot tell us whether an Account, QoS, or Association
# already exists, nor whether a removal would affect an active job.
- name: Read current Account metadata
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - account
      - format=Account,Description,Organization
  register: slurm_current_accounts
  changed_when: false
  check_mode: false

- name: Read current user defaults
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - user
      - format=User,DefaultAccount
  register: slurm_current_users
  changed_when: false
  check_mode: false

- name: Read each declared Job QoS
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - qos
      - "Name={{ item.name }}"
      - >-
        format={{ (['Name', 'Priority'] + slurm_qos_guard_fields) | join(',') }}
  loop: "{{ slurm_job_qos }}"
  loop_control:
    label: "{{ item.name }}"
  register: slurm_current_qos
  changed_when: false
  check_mode: false

- name: Compare declared Job QoS priorities with SlurmDBD
  ansible.builtin.set_fact:
    slurm_qos_plan: >-
      {{ (slurm_qos_plan | default([]))
         + [{
             'name': item.item.name,
             'priority': item.item.priority,
             'action': qos_action
           }] }}
  vars:
    qos_action: >-
      {{ 'create'
         if item.stdout | trim == ''
         else (
           'update'
           if (item.stdout.split('|')[1] | int) != (item.item.priority | int)
           else 'keep'
         ) }}
  loop: "{{ slurm_current_qos.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Refuse undeclared Job QoS limits or behavior
  ansible.builtin.assert:
    that:
      - >-
        item.stdout.split('|')[2:]
        | reject('equalto', '')
        | list
        | length == 0
    fail_msg: >-
      Job QoS {{ item.item.name }} contains an undeclared limit, flag, or
      preemption relationship. Inspect it with sacctmgr before continuing:
      {{ item.stdout | trim }}
    quiet: true
  loop: "{{ slurm_current_qos.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout | trim != ''

- name: Read current cluster Associations once
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - association
      - WOPLimits
      - "Cluster={{ slurm_cluster_name }}"
      - format=Cluster,Account,User,Partition,Fairshare,GrpTRES,QOS,DefaultQOS
  register: slurm_current_associations
  changed_when: false
  check_mode: false

- name: Calculate desired state and database changes
  ansible.builtin.set_fact:
    slurm_desired: >-
      {{ cluster_users
         | slurm_desired_state(
             slurm_accounts,
             slurm_partitions,
             slurm_default_qos,
             project_qos_users
           ) }}

- name: Compare desired state with current SlurmDBD records
  ansible.builtin.set_fact:
    slurm_account_plan: >-
      {{ slurm_desired
         | slurm_account_plan(
             slurm_current_accounts.stdout_lines,
             slurm_current_associations.stdout_lines,
             slurm_cluster_name
           ) }}
    slurm_default_account_plan: >-
      {{ slurm_desired
         | slurm_user_default_plan(slurm_current_users.stdout_lines) }}
    slurm_association_plan: >-
      {{ slurm_desired
         | slurm_association_plan(
             slurm_current_associations.stdout_lines,
             slurm_cluster_name
           ) }}

- name: Read running and pending jobs before planning removals
  ansible.builtin.command:
    argv:
      - /usr/bin/squeue
      - --noheader
      - --states=PENDING,RUNNING
      - --format=%u|%a|%P|%i|%T
  register: slurm_active_jobs
  changed_when: false
  check_mode: false

- name: Find jobs whose Association would be removed
  ansible.builtin.set_fact:
    slurm_removal_blockers: >-
      {{ slurm_association_plan.remove_associations
         | slurm_blocking_jobs(slurm_active_jobs.stdout_lines) }}

- name: Refuse to remove an Association used by an active job
  ansible.builtin.assert:
    that:
      - slurm_removal_blockers | length == 0
    fail_msg: >-
      Association removal is blocked by these running or pending jobs:
      {{ slurm_removal_blockers | to_nice_json }}
    quiet: true

- name: Show the planned Account and Association changes
  ansible.builtin.debug:
    msg:
      account_entities: "{{ slurm_account_plan }}"
      job_qos: "{{ slurm_qos_plan }}"
      default_accounts: "{{ slurm_default_account_plan }}"
      associations_to_add: "{{ slurm_association_plan.add_associations }}"
      associations_to_update: "{{ slurm_association_plan.update_associations }}"
      associations_to_remove: "{{ slurm_association_plan.remove_associations }}"
      authorization_matrix: "{{ slurm_desired.authorization_matrix }}"
