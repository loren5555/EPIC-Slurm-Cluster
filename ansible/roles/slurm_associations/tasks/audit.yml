---
- name: Read Associations after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - association
      - WOPLimits
      - "Cluster={{ slurm_cluster_name }}"
      - format=Cluster,Account,User,Partition,Fairshare,GrpTRES,QOS,DefaultQOS
  register: slurm_final_associations
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Read Job QoS after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - qos
      - "Name={{ item.name }}"
      - >-
        format={{ (['Name', 'Priority'] + slurm_qos_guard_fields) | join(',') }}
  loop: "{{ slurm_job_qos }}"
  loop_control:
    label: "{{ item.name }}"
  register: slurm_final_qos
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Read Account metadata after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - account
      - format=Account,Description,Organization
  register: slurm_final_accounts
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Require queue-only Job QoS convergence
  ansible.builtin.assert:
    that:
      - item.stdout | trim != ''
      - (item.stdout.split('|')[1] | int) == (item.item.priority | int)
      - >-
        item.stdout.split('|')[2:]
        | reject('equalto', '')
        | list
        | length == 0
    fail_msg: >-
      Job QoS {{ item.item.name }} must have its declared Priority and no
      undeclared limit, flag, or preemption relationship:
      {{ item.stdout | trim }}
    quiet: true
  loop: "{{ slurm_final_qos.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not ansible_check_mode

- name: Read user defaults after convergence
  ansible.builtin.command:
    argv:
      - /usr/bin/sacctmgr
      - --noheader
      - --parsable2
      - show
      - user
      - format=User,DefaultAccount
  register: slurm_final_users
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Calculate the final Association audit
  ansible.builtin.set_fact:
    slurm_final_association_plan: >-
      {{ slurm_desired
         | slurm_association_plan(
             slurm_final_associations.stdout_lines,
             slurm_cluster_name
           ) }}
    slurm_final_account_plan: >-
      {{ slurm_desired
         | slurm_account_plan(
             slurm_final_accounts.stdout_lines,
             slurm_final_associations.stdout_lines,
             slurm_cluster_name
           ) }}
    slurm_final_default_account_plan: >-
      {{ slurm_desired
         | slurm_user_default_plan(slurm_final_users.stdout_lines) }}
  when: not ansible_check_mode

- name: Require exact Association convergence
  ansible.builtin.assert:
    that:
      - slurm_final_association_plan.add_associations | length == 0
      - slurm_final_association_plan.update_associations | length == 0
      - slurm_final_association_plan.remove_associations | length == 0
      - slurm_final_account_plan.add_accounts | length == 0
      - slurm_final_account_plan.update_accounts | length == 0
      - slurm_final_account_plan.add_cluster_associations | length == 0
      - slurm_final_account_plan.update_cluster_associations | length == 0
      - slurm_final_default_account_plan | length == 0
    fail_msg: >-
      SlurmDBD does not match the declared Association state:
      {{ {
           'accounts': slurm_final_account_plan,
           'default_accounts': slurm_final_default_account_plan,
           'associations': slurm_final_association_plan
         } | to_nice_json }}
    quiet: true
  when: not ansible_check_mode

- name: Show the effective user-by-partition audit matrix
  ansible.builtin.debug:
    var: slurm_desired.authorization_matrix
