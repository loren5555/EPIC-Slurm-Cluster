---
# Run only on controller hosts. Validate or generate one dedicated cluster key
# pair per user, then publish public keys as a transient in-memory map. Ansible
# never reads private-key content.
- name: Inspect cluster private keys before generation
  ansible.builtin.stat:
    path: "{{ item.home }}/.ssh/epic_cluster_ed25519"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: epic_ssh_private_keys_before

- name: Inspect cluster public keys before generation
  ansible.builtin.stat:
    path: "{{ item.home }}/.ssh/epic_cluster_ed25519.pub"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: epic_ssh_public_keys_before

- name: Refuse incomplete existing key pairs
  # Both stat loops use the same cluster_users order, so epic_ssh_key_index
  # compares the private and public files belonging to the same user.
  ansible.builtin.assert:
    that:
      - >-
        item.stat.exists
        == epic_ssh_public_keys_before.results[epic_ssh_key_index].stat.exists
    fail_msg: >-
      Incomplete cluster key pair for {{ item.item.name }} on the controller;
      preserve or repair it manually before Ansible continues.
    quiet: true
  loop: "{{ epic_ssh_private_keys_before.results }}"
  loop_control:
    label: "{{ item.item.name }}"
    index_var: epic_ssh_key_index

- name: Generate missing user cluster keys without replacing existing keys
  # The relative key path is resolved under the user's home. force=false keeps
  # existing keys valid for workstations that already copied the private key.
  ansible.builtin.user:
    name: "{{ item.name }}"
    generate_ssh_key: true
    ssh_key_file: .ssh/epic_cluster_ed25519
    ssh_key_type: ed25519
    ssh_key_comment: "{{ item.name }}@{{ inventory_hostname }}"
    force: false
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Explain keys that a check-mode run cannot distribute yet
  # Check mode predicts key creation but does not create a public key that can be
  # read and displayed as an authorized_keys change.
  ansible.builtin.debug:
    msg: >-
      CHECK MODE: would generate {{ item.item.home }}/.ssh/epic_cluster_ed25519
      and authorize its public key according to ssh_access.
  loop: "{{ epic_ssh_private_keys_before.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ansible_check_mode
    - not item.stat.exists

- name: Inspect cluster public keys after generation
  # Real runs see newly generated keys; first-run check mode still sees them as
  # absent and safely skips the following read.
  ansible.builtin.stat:
    path: "{{ item.home }}/.ssh/epic_cluster_ed25519.pub"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: epic_ssh_keys_after

- name: Read available cluster public keys from the controller
  # slurp reads only .pub files and returns their contents in base64 form.
  ansible.builtin.slurp:
    src: "{{ item.home }}/.ssh/epic_cluster_ed25519.pub"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: epic_ssh_user_index
  when: epic_ssh_keys_after.results[epic_ssh_user_index].stat.exists
  register: epic_ssh_public_key_reads

- name: Initialize the public-key source map
  # This fact exists only during the current playbook run and is not written to
  # the repository or a persistent secret store.
  ansible.builtin.set_fact:
    epic_cluster_public_keys: {}

- name: Build the public-key source map in memory
  # Decode and trim each key, then merge it into the username-to-public-key map.
  ansible.builtin.set_fact:
    epic_cluster_public_keys: >-
      {{
        epic_cluster_public_keys
        | combine({item.item.name: item.content | b64decode | trim})
      }}
  loop: "{{ epic_ssh_public_key_reads.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.skipped | default(false))
