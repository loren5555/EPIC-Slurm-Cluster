---
# Run once per target host. Only the marked EPIC key block is managed; all
# unmarked personal and legacy keys are deliberately preserved.
- name: Calculate users authorized on this host
  ansible.builtin.set_fact:
    epic_ssh_authorized_user_names: >-
      {{
        cluster_users
        | epic_ssh_authorized_users(inventory_hostname, groups['controllers'])
      }}
    epic_ssh_public_key_source: >-
      {{ hostvars[groups['controllers'][0]].epic_cluster_public_keys }}

# key_source.yml stored the public-key map on the primary controller. hostvars
# makes that fact available while processing controller and compute hosts.
- name: Require every authorized public key during a real run
  # Set difference reveals authorized users missing from the key map. First-run
  # check mode skips this because predicted keys do not exist yet.
  ansible.builtin.assert:
    that:
      - >-
        epic_ssh_authorized_user_names
        | difference(epic_ssh_public_key_source.keys() | list)
        | length == 0
    fail_msg: >-
      Controller public keys are missing for:
      {{
        epic_ssh_authorized_user_names
        | difference(epic_ssh_public_key_source.keys() | list)
        | join(', ')
      }}
  when: not ansible_check_mode

- name: Create SSH directories for authorized users
  # OpenSSH expects each user's SSH directory to be private and user-owned.
  ansible.builtin.file:
    path: "{{ item.home }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name in epic_ssh_authorized_user_names
    - item.name in epic_ssh_public_key_source

- name: Install the managed cluster key without replacing personal keys
  # blockinfile owns only the uniquely marked block and preserves every line
  # outside it.
  ansible.builtin.blockinfile:
    path: "{{ item.home }}/.ssh/authorized_keys"
    create: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED EPIC CLUSTER KEY"
    block: "{{ epic_ssh_public_key_source[item.name] }}"
    state: present
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name in epic_ssh_authorized_user_names
    - item.name in epic_ssh_public_key_source

- name: Install the managed SSH client configuration on the controller
  # OOD's built-in Shell invokes OpenSSH by inventory hostname. The explicit
  # IdentityFile makes that connection use the generated cluster key instead
  # of relying on a conventional id_ed25519 filename.
  ansible.builtin.blockinfile:
    path: "{{ item.home }}/.ssh/config"
    create: true
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED EPIC SSH CLIENT CONFIG"
    block: "{{ lookup('ansible.builtin.template', 'client_config.j2') }}"
    state: present
  vars:
    ssh_config_user: "{{ item }}"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - inventory_hostname in groups['controllers']
    - item.name in epic_ssh_public_key_source

- name: Inspect authorized_keys for users not authorized on this host
  # Stat first avoids touching or creating a nonexistent authorized_keys file.
  ansible.builtin.stat:
    path: "{{ item.home }}/.ssh/authorized_keys"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in epic_ssh_authorized_user_names
  register: epic_ssh_unauthorized_key_files

- name: Remove only the managed cluster key from unauthorized users
  # state=absent removes the marked block, not the file or personal keys.
  # item.item is the original user object retained in the registered stat result.
  ansible.builtin.blockinfile:
    path: "{{ item.item.home }}/.ssh/authorized_keys"
    marker: "# {mark} ANSIBLE MANAGED EPIC CLUSTER KEY"
    state: absent
  loop: "{{ epic_ssh_unauthorized_key_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - not (item.skipped | default(false))
    - item.stat.exists
