---
# The stable controller hostname remains the portal's canonical address.
ood_server_address: epic-cluster-controller-01
# Fixed addresses also work directly through Apache aliases and certificate SANs.
ood_server_ip_addresses:
  - "222.20.99.125"
ood_https_port: 8443

# Batch Connect and Job Composer exchange their context through this one small
# NFS export. User homes and Slurm state remain local to each host.
ood_shared_root: /srv/epic/ood
ood_dashboard_dataroot: "{{ ood_shared_root }}/users/$USER/ondemand/data/sys/dashboard"
ood_myjobs_dataroot: "{{ ood_shared_root }}/users/$USER/ondemand/data/sys/myjobs"
ood_session_retention_days: 30
ood_automount_idle_seconds: 300
ood_quota_directory: "{{ ood_shared_root }}/quota"
ood_quota_threshold: 0.80
ood_quota_stale_seconds: 900
ood_quota_writer_user: administrator

# Interactive applications are deliberately shorter than ordinary 14-day batch
# jobs so abandoned browser sessions do not occupy accelerators indefinitely.
ood_interactive_maximum_hours: 32

ood_configuration_directory: /etc/ood/config
ood_authentication_file: /etc/ood/auth/htpasswd
ood_tls_directory: /etc/ood/tls
ood_application_deploy_root: /opt/ood_apps/epic
ood_exporter_port: 9301

# IAPP source publication and its compute-node runtime are separate concerns.
# Keep these paths stable across nodes: ood_compute checks them before exposing
# a node through the shared Batch Connect applications. Runtime installation is
# an explicit superadmin bootstrap step documented in the compute-node guide.
ood_compute_runtime_executables:
  - name: Code Server
    application: IAPP_codeserver
    path: /usr/local/bin/code-server
  - name: ttyd
    application: IAPP_ttyd
    path: /usr/bin/ttyd
  - name: JupyterLab
    application: IAPP_jupyter
    path: /opt/jupyterlab/bin/jupyter-lab
  - name: TensorBoard
    application: IAPP_tensorboard
    path: /opt/tensorboard/bin/tensorboard

# Passenger 6.1.2 cannot start the Node 22 OOD Shell with V8 JIT enabled in a
# PUN. This affects only Node applications hosted inside the OOD PUN.
ood_pun_node_options: --jitless

ood_system_applications:
  - IAPP_jupyter
  - IAPP_codeserver
  - IAPP_ttyd
  - IAPP_tensorboard
  - IAPP_script
  - LINK_grafana

ood_dashboard_pinned_apps:
  - sys/IAPP_jupyter
  - sys/IAPP_codeserver
  - sys/IAPP_ttyd
  - sys/IAPP_tensorboard
  - sys/IAPP_script
  - sys/LINK_grafana
  - sys/activejobs
  - sys/myjobs
  - sys/projects
  - sys/files
