---
# Values are taken from the validated slurmd -C output, with a small memory
# reserve left for the operating system and node daemons.
slurm_cpus: 128
slurm_boards: 1
slurm_sockets_per_board: 2
slurm_cores_per_socket: 64
slurm_threads_per_core: 1
slurm_real_memory: 1024000

# The GPU model and device files are discovered locally by AutoDetect=nvidia.
# Inventory only declares the resource count that the node must register.
slurm_gpu_count: 8
slurm_gpu_shards_per_gpu: 4

# Memory remains visible for user requests and accounting, but does not block
# scheduling. CPU sharing is opt-in per job, up to four jobs per core.
slurm_select_type_parameters: CR_Core
slurm_oversubscribe: YES:4

# Friendly text shown in OOD; Slurm still receives the complete partition name.
ood_display_name: "A100 40 GB × 8 — Node 01 — Controlled"

# One full GPU is one billing unit; four shards add up to the same cost.
slurm_tres_billing_weights: "CPU=0.05,GRES/gpu=1,GRES/shard=0.25"

# Filesystem quota policy. Filesystem initialization is manual; Ansible only
# maintains limits after user identities and quota accounting already exist.
disk_quotas:
  - filesystem: /home
    soft_gib: 20
    hard_gib: 30
    grace_period_seconds: 259200
  - filesystem: /workspace
    soft_gib: 1024
    hard_gib: 0
    grace_period_seconds: 604800
