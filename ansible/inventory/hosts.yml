# EPIC cluster inventory.
# Stable inventory hostnames are referenced by users.yml ssh_access lists, while
# ansible_host values may change with the network environment.
all:
  # Connect through the shared administrator account and escalate only for
  # system configuration tasks.
  vars:
    ansible_user: administrator
    ansible_become: true
  children:
    # The controller is also the Ansible control machine, so it uses a local
    # connection. The first controller is currently the primary key source.
    controllers:
      hosts:
        epic-cluster-controller-01:
          ansible_connection: local
    # Parent group for operations that target every compute node.
    compute_nodes:
      children:
        controlled_compute_nodes: {}
        free_compute_nodes: {}
    # Controlled nodes expose GPUs through Slurm allocations while retaining
    # SSH access for development and CPU-side work.
    controlled_compute_nodes:
      hosts:
        epic-cluster-compute-a100-01:
          ansible_host: 172.16.3.165
    # Free nodes allow ordinary SSH workloads and Slurm jobs to coexist.
    free_compute_nodes:
      hosts:
        epic-cluster-compute-rtx4070-01:
          ansible_host: 192.168.77.11
    # GPU monitoring is explicit. A future CPU-only host in either compute
    # category must not inherit NVIDIA services by accident.
    gpu_nodes:
      hosts:
        epic-cluster-compute-a100-01:
        epic-cluster-compute-rtx4070-01:
